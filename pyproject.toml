[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xld_logchecker"
version = "0.8.0"
description = "Logchecker for logs generated by XLD"
readme = "README.md"
requires-python = ">=3.5"
license = {text = "MIT"}
authors = [
    {name = "OPS", email = "noreply@mail.orpheus.network"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = []

[dependency-groups]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/OPSnet/xld_logchecker.py"

[project.scripts]
xld_logchecker = "xld_logchecker:main"

[tool.setuptools]
py-modules = ["xld_logchecker"]
